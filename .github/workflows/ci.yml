name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - uses: supabase/setup-cli@v3.2.0
      - run: supabase start
      - run: pnpm test

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    environment: staging
    concurrency: deploy-staging
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # R1.14: migrations run first, as the table owner. A failure stops the deploy.
      - run: pnpm --filter @gear/api db:migrate
        env:
          DATABASE_OWNER_URL: ${{ secrets.STAGING_DATABASE_OWNER_URL }}
      - uses: superfly/flyctl-actions/setup-flyctl@1.5
      - run: flyctl deploy --remote-only --config apps/api/fly.toml --dockerfile apps/api/Dockerfile --app "$FLY_APP"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: ${{ vars.FLY_APP_STAGING }}

  deploy-web-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: staging
    concurrency: deploy-web-staging
    defaults:
      run:
        working-directory: apps/app
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The build reads the EXPO_PUBLIC_* values from EAS's preview environment.
      - run: npx --yes eas-cli@27.10.0 env:pull preview --non-interactive
      - run: npx expo export --platform web
      # The server-rendered pages read the same values at request time, hence --environment.
      - run: npx --yes eas-cli@27.10.0 deploy --alias staging --environment preview --non-interactive
